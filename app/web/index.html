<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pydantic AI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1020; color: #e8edf7; display: grid; place-items: center; padding: 24px; }
    main { width: min(760px, 100%); height: min(760px, calc(100vh - 48px)); background: #11182b; border: 1px solid #28324a; border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 80px #0007; }
    header { padding: 20px 24px; border-bottom: 1px solid #28324a; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header button { padding: 9px 13px; white-space: nowrap; }
    h1 { font-size: 1.1rem; margin: 0 0 6px; }
    #config { color: #99a7c2; font-size: .85rem; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 85%; padding: 12px 15px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: #635bff; }
    .assistant { align-self: flex-start; background: #202a42; }
    .error { align-self: flex-start; background: #4a2027; color: #ffd9dd; }
    form { display: flex; gap: 10px; padding: 18px; border-top: 1px solid #28324a; }
    textarea { flex: 1; resize: none; min-height: 48px; max-height: 140px; border: 1px solid #35415e; border-radius: 12px; padding: 12px; background: #0b1020; color: inherit; font: inherit; }
    button { border: 0; border-radius: 12px; padding: 0 20px; background: #635bff; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 600px) { body { padding: 0; } main { width: 100%; height: 100vh; border: 0; border-radius: 0; } header, #messages { padding: 16px; } form { padding: 12px; } .message { max-width: 92%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Pydantic AI</h1><div id="config">Loading configuration...</div></div>
      <button id="new-chat" type="button">New Chat</button>
    </header>
    <section id="messages" aria-live="polite"></section>
    <form id="chat-form">
      <textarea id="message" maxlength="20000" placeholder="Type a message..." aria-label="Message" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    const storageKey = 'pydantic-ai-conversation-id';
    let conversationId = localStorage.getItem(storageKey);
    let submitting = false;

    function addMessage(text, role) {
      const item = document.createElement('div');
      item.className = `message ${role}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    function resetConversation(greeting = 'Hello! How can I help?') {
      conversationId = null;
      localStorage.removeItem(storageKey);
      messages.replaceChildren();
      addMessage(greeting, 'assistant');
    }

    function renderHistory(history) {
      messages.replaceChildren();
      for (const message of history) {
        if (message.kind === 'request') {
          for (const part of message.parts || []) {
            if (part.part_kind === 'user-prompt' && typeof part.content === 'string') {
              addMessage(part.content, 'user');
            }
          }
        } else if (message.kind === 'response') {
          for (const part of message.parts || []) {
            if (part.part_kind === 'text' && typeof part.content === 'string') {
              addMessage(part.content, 'assistant');
            }
          }
        }
      }
      if (!messages.children.length) addMessage('Hello! How can I help?', 'assistant');
    }

    async function restoreConversation() {
      if (!conversationId) { resetConversation(); return; }
      try {
        const response = await fetch(`/api/conversations/${encodeURIComponent(conversationId)}`);
        if (response.status === 404 || response.status === 422) {
          resetConversation('The saved conversation no longer exists. Starting a new chat.');
          return;
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Could not restore the conversation.');
        renderHistory(data.messages);
      } catch (error) {
        messages.replaceChildren();
        addMessage(error.message || 'Could not connect to the server.', 'error');
      }
    }

    fetch('/api/config').then(response => response.json()).then(config => {
      const warning = config.configured ? '' : ' / API key required';
      document.querySelector('#config').textContent = `${config.provider} / ${config.model}${warning}`;
    }).catch(() => { document.querySelector('#config').textContent = 'Configuration unavailable'; });

    restoreConversation();
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
    });
    document.querySelector('#new-chat').addEventListener('click', () => {
      resetConversation('New conversation started. How can I help?');
      input.focus();
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || submitting) return;
      submitting = true;
      addMessage(message, 'user');
      input.value = '';
      send.disabled = true;
      const pending = addMessage('Thinking...', 'assistant');
      try {
        const body = {message};
        if (conversationId) body.conversation_id = conversationId;
        const response = await fetch('/api/chat', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
        });
        const data = await response.json();
        if (response.ok) {
          conversationId = data.conversation_id;
          localStorage.setItem(storageKey, conversationId);
          pending.textContent = data.response;
        } else {
          pending.textContent = data.detail || `Request failed (${response.status}).`;
          pending.className = 'message error';
          if (response.status === 404 && conversationId) {
            conversationId = null;
            localStorage.removeItem(storageKey);
          }
        }
      } catch (_) {
        pending.textContent = 'Could not connect to the server.';
        pending.className = 'message error';
      } finally {
        submitting = false;
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
